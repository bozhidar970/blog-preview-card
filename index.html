<!doctype html>
<html>
  <head>
    <style>
      body {
        background-color: rgba(250, 211, 54, 0.893);
        font-family: Arial;
      }

      .container {
        margin-top: 50px;
        margin-left: 200px;
        border: 1px solid black;
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 1);
        border-radius: 13px;
        background-color: white;
        width: 345px;
      }

      .text {
        width: 300px;
        margin-left: 20px;
        color: gray;
      }

      .picture {
        margin-top: 20px;
        margin-left: 20px;
        border-radius: 13px;
        width: 305px;
      }

      .learning-paragraph {
        margin-left: 20px;
        margin-top: 20px;
        margin-bottom: 15px;
        background-color: rgba(250, 211, 54, 0.893);
        display: inline-block;
        padding: 7px 10px;
        border-radius: 7px;
        font-weight: bold;
      }

      .published-paragraph {
        margin-left: 20px;
        margin-bottom: 17px;
      }

      .title {
        font-weight: bold;
        font-size: 24px;
        margin-left: 20px;
        margin-bottom: 19px;
      }

      .profile {
        display: flex;
        align-items: center;
      }

      .profile-picture {
        margin: 17px 10px 20px 20px;
        width: 32px;
        height: 32px;

      }

      .profile-picture-name {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="picture-container">
        <img src="illustration-article.svg" class="picture" />
      </div>
      <div class="learning-paragraph">Learning</div>
      <div class="published-paragraph">Published 21 Dec 2023</div>
      <div class="title">HTML & CSS foundations</div>
      <div class="text">
        These laguages are the backbone of every website, defining structure,
        content, and presentation.
      </div>
      <div class="profile">
        <img src="image-avatar.webp" class="profile-picture" />
        <div class="profile-picture-name">Greg Hooper</div>
      </div>
    </div>
  </body>
</html>
